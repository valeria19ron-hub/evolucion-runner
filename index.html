<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evolución Runner</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <div class="hud">
            <span id="stage-display">Etapa: Humano</span>
            <span id="distance-display">Distancia: 0m</span>
        </div>
        
        <canvas id="gameCanvas" width="800" height="300"></canvas>
        
        <div id="battle-ui" class="hidden">
            <p id="battle-text">¡OBJETIVO DETECTADO! Presiona FLECHA ABAJO (↓) dos veces para derrotarlo</p>
            <div class="progress-bar"><div id="battle-progress"></div></div>
        </div>

        <div class="controls-info">
            <p><strong>Controles:</strong> [Espacio / ↑] Saltar (Doble salto solo ante obstáculos grandes) | [↓ x2] Atacar al chocar</p>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let COLOR_SILHOUETTE = '#111111';
        let COLOR_WATER = '#000000';
        let COLOR_BG = '#d3d3d3';
        let frameCount = 0;

        function updateColorsFromCSS() {
            const styles = getComputedStyle(document.documentElement);
            const sil = styles.getPropertyValue('--silhouette-color').trim();
            const wat = styles.getPropertyValue('--water-color').trim();
            const bg = styles.getPropertyValue('--bg-color').trim();
            if (sil) COLOR_SILHOUETTE = sil;
            if (wat) COLOR_WATER = wat;
            if (bg) COLOR_BG = bg;
        }

        const STAGES = [
            {
                name: "Humano",
                environment: "land",
                playerSize: { w: 28, h: 52 },
                obstacles: [
                    { type: "bici", w: 46, h: 30, big: false },
                    { type: "asaltante", w: 34, h: 46, big: false },
                    { type: "auto", w: 85, h: 42, big: true }
                ],
                boss: { name: "Sirena", type: "Sirena", w: 70, h: 52 }
            },
            {
                name: "Sirena",
                environment: "sea",
                playerSize: { w: 62, h: 30 },
                obstacles: [
                    { type: "contaminacion", w: 38, h: 28, big: false },
                    { type: "red", w: 46, h: 65, big: true },
                    { type: "barco_pequeno", w: 75, h: 42, big: true }
                ],
                boss: { name: "Barco Gigante", type: "Barco Gigante", w: 130, h: 80 }
            },
            {
                name: "Barco Gigante",
                environment: "sea",
                playerSize: { w: 115, h: 60 },
                obstacles: [
                    { type: "barco_enemigo", w: 85, h: 52, big: true },
                    { type: "roca_marina", w: 48, h: 42, big: false }
                ],
                boss: { name: "Calamar Gigante", type: "Calamar Gigante", w: 110, h: 90 }
            },
            {
                name: "Calamar Gigante",
                environment: "sea",
                playerSize: { w: 80, h: 60 },
                obstacles: [
                    { type: "submarino", w: 95, h: 42, big: true },
                    { type: "mina_marina", w: 36, h: 36, big: false }
                ],
                boss: { name: "Dragón Mitológico", type: "Dragón Mitológico", w: 140, h: 90 }
            },
            {
                name: "Dragón Mitológico",
                environment: "sky",
                playerSize: { w: 105, h: 60 },
                obstacles: [
                    { type: "torre", w: 46, h: 88, big: true },
                    { type: "grifo", w: 60, h: 44, big: false }
                ],
                boss: { name: "Fénix Ancestral", type: "Fénix Ancestral", w: 120, h: 85 }
            }
        ];

        function drawSilhouette(type, x, y, w, h) {
            ctx.fillStyle = COLOR_SILHOUETTE;
            ctx.strokeStyle = COLOR_SILHOUETTE;
            const step = Math.sin(frameCount * 0.25) * 6;

            ctx.beginPath();
            switch (type) {
                case "Humano":
                    ctx.arc(x + w * 0.55, y + 8, 7, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.moveTo(x + w * 0.4, y + 16);
                    ctx.lineTo(x + w * 0.68, y + 16);
                    ctx.lineTo(x + w * 0.6, y + 34);
                    ctx.lineTo(x + w * 0.35, y + 34);
                    ctx.fill();
                    ctx.lineWidth = 3.5;
                    ctx.beginPath();
                    ctx.moveTo(x + w * 0.55, y + 18);
                    ctx.lineTo(x + w * 0.85 + step, y + 26);
                    ctx.moveTo(x + w * 0.45, y + 18);
                    ctx.lineTo(x + w * 0.15 - step, y + 28);
                    ctx.moveTo(x + w * 0.42, y + 34);
                    ctx.lineTo(x + w * 0.2 - step, y + h - 8);
                    ctx.lineTo(x + w * 0.1 - step, y + h);
                    ctx.moveTo(x + w * 0.58, y + 34);
                    ctx.lineTo(x + w * 0.82 + step, y + h - 8);
                    ctx.lineTo(x + w * 0.92 + step, y + h);
                    ctx.stroke();
                    break;

                case "asaltante":
                    ctx.arc(x + w * 0.45, y + 10, 7, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.moveTo(x + w * 0.45, y + 3);
                    ctx.lineTo(x + w * 0.65, y + 12);
                    ctx.lineTo(x + w * 0.35, y + 14);
                    ctx.fill();
                    ctx.fillRect(x + w * 0.3, y + 17, w * 0.42, 16);
                    ctx.fillRect(x + 6, y + 20, w * 0.3, 4);
                    ctx.beginPath();
                    ctx.moveTo(x + 6, y + 20);
                    ctx.lineTo(x, y + 22);
                    ctx.lineTo(x + 6, y + 24);
                    ctx.fill();
                    ctx.fillRect(x + w * 0.28, y + 33, 5, h - 33);
                    ctx.fillRect(x + w * 0.55, y + 33, 5, h - 33);
                    break;
                case "bici":
                    ctx.lineWidth = 2.5;
                    ctx.arc(x + 9, y + h - 9, 8, 0, Math.PI * 2);
                    ctx.moveTo(x + w - 9 + 8, y + h - 9);
                    ctx.arc(x + w - 9, y + h - 9, 8, 0, Math.PI * 2);
                    ctx.moveTo(x + 9, y + h - 9);
                    ctx.lineTo(x + w * 0.45, y + 10);
                    ctx.lineTo(x + w - 9, y + h - 9);
                    ctx.moveTo(x + w * 0.45, y + 10);
                    ctx.lineTo(x + w * 0.3, y + 5);
                    ctx.moveTo(x + w * 0.65, y + 6);
                    ctx.lineTo(x + w - 9, y + h - 9);
                    ctx.stroke();
                    ctx.fillRect(x + w * 0.22, y + 3, 8, 3);
                    break;

                case "auto":
                    ctx.beginPath();
                    ctx.moveTo(x + 2, y + h - 8);
                    ctx.lineTo(x + 2, y + h * 0.45);
                    ctx.lineTo(x + w * 0.22, y + h * 0.4);
                    ctx.lineTo(x + w * 0.38, y + 4);
                    ctx.lineTo(x + w * 0.78, y + 4);
                    ctx.lineTo(x + w * 0.92, y + h * 0.42);
                    ctx.lineTo(x + w, y + h * 0.48);
                    ctx.lineTo(x + w, y + h - 8);
                    ctx.fill();
                    ctx.fillStyle = COLOR_BG;
                    ctx.beginPath();
                    ctx.moveTo(x + w * 0.26, y + h * 0.4);
                    ctx.lineTo(x + w * 0.4, y + 8);
                    ctx.lineTo(x + w * 0.56, y + 8);
                    ctx.lineTo(x + w * 0.56, y + h * 0.4);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.moveTo(x + w * 0.6, y + h * 0.4);
                    ctx.lineTo(x + w * 0.6, y + 8);
                    ctx.lineTo(x + w * 0.75, y + 8);
                    ctx.lineTo(x + w * 0.86, y + h * 0.4);
                    ctx.fill();
                    ctx.fillStyle = COLOR_SILHOUETTE;
                    ctx.beginPath();
                    ctx.arc(x + w * 0.22, y + h - 7, 8, 0, Math.PI * 2);
                    ctx.arc(x + w * 0.78, y + h - 7, 8, 0, Math.PI * 2);
                    ctx.fill();
                    break;

                case "Sirena":
                    ctx.arc(x + w * 0.78, y + h * 0.28, 7, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.moveTo(x + w * 0.78, y + h * 0.22);
                    ctx.quadraticCurveTo(x + w * 0.55, y + 2, x + w * 0.42, y + h * 0.35 - step * 0.4);
                    ctx.lineTo(x + w * 0.68, y + h * 0.35);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.moveTo(x + w * 0.78, y + h * 0.35);
                    ctx.quadraticCurveTo(x + w * 0.45, y + h * 0.85, x + 14, y + h * 0.5 + step * 0.6);
                    ctx.lineTo(x, y + h * 0.15 + step * 0.6);
                    ctx.lineTo(x + 10, y + h * 0.55 + step * 0.6);
                    ctx.lineTo(x, y + h * 0.92 + step * 0.6);
                    ctx.fill();
                    break;

                case "contaminacion":
                    ctx.fillRect(x + 6, y + 8, w - 12, h - 8);
                    ctx.fillRect(x + 4, y + 12, w - 8, 3);
                    ctx.fillRect(x + 4, y + 20, w - 8, 3);
                    ctx.beginPath();
                    ctx.arc(x + w * 0.35, y + 6, 5, 0, Math.PI * 2);
                    ctx.arc(x + w * 0.65, y + 5, 6, 0, Math.PI * 2);
                    ctx.fill();
                    break;

                case "red":
                    ctx.fillRect(x, y, w, 4);
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    for (let i = 4; i <= w - 4; i += 8) {
                        ctx.moveTo(x + i, y + 4);
                        ctx.lineTo(x + i + Math.sin(i) * 3, y + h * 0.9);
                    }
                    for (let j = 10; j <= h * 0.88; j += 8) {
                        ctx.moveTo(x + 2, y + j);
                        ctx.lineTo(x + w - 2, y + j);
                    }
                    ctx.stroke();
                    break;
                case "barco_pequeno":
                case "barco_enemigo":
                case "Barco Gigante":
                    ctx.beginPath();
                    ctx.moveTo(x, y + h * 0.62);
                    ctx.lineTo(x + w, y + h * 0.58);
                    ctx.lineTo(x + w * 0.84, y + h);
                    ctx.lineTo(x + w * 0.12, y + h);
                    ctx.fill();
                    ctx.fillRect(x + w * 0.46, y + 4, 3, h * 0.6);
                    ctx.beginPath();
                    ctx.moveTo(x + w * 0.5, y + 6);
                    ctx.quadraticCurveTo(x + w * 0.85, y + h * 0.3, x + w * 0.5, y + h * 0.56);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.moveTo(x + w * 0.45, y + 12);
                    ctx.quadraticCurveTo(x + w * 0.15, y + h * 0.35, x + w * 0.45, y + h * 0.56);
                    ctx.fill();
                    ctx.fillRect(x + w * 0.35, y + 4, 12, 5);
                    break;

                case "roca_marina":
                    ctx.beginPath();
                    ctx.moveTo(x, y + h);
                    ctx.lineTo(x + w * 0.2, y + h * 0.35);
                    ctx.lineTo(x + w * 0.48, y);
                    ctx.lineTo(x + w * 0.72, y + h * 0.25);
                    ctx.lineTo(x + w * 0.9, y + h * 0.45);
                    ctx.lineTo(x + w, y + h);
                    ctx.fill();
                    break;

                case "Calamar Gigante":
                    ctx.beginPath();
                    ctx.moveTo(x + w * 0.25, y + h * 0.52);
                    ctx.lineTo(x + w * 0.2, y + h * 0.25);
                    ctx.lineTo(x + w * 0.5, y);
                    ctx.lineTo(x + w * 0.8, y + h * 0.25);
                    ctx.lineTo(x + w * 0.75, y + h * 0.52);
                    ctx.fill();
                    ctx.fillStyle = COLOR_BG;
                    ctx.beginPath();
                    ctx.arc(x + w * 0.4, y + h * 0.42, 3.5, 0, Math.PI * 2);
                    ctx.arc(x + w * 0.6, y + h * 0.42, 3.5, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.strokeStyle = COLOR_SILHOUETTE;
                    ctx.lineWidth = 4.5;
                    ctx.beginPath();
                    for (let t = 0.25; t <= 0.75; t += 0.125) {
                        ctx.moveTo(x + w * t, y + h * 0.5);
                        ctx.bezierCurveTo(
                            x + w * t + step * 1.4, y + h * 0.68,
                            x + w * t - step * 1.4, y + h * 0.85,
                            x + w * t + step * 0.5, y + h
                        );
                    }
                    ctx.stroke();
                    break;

                case "submarino":
                    ctx.beginPath();
                    ctx.ellipse(x + w * 0.5, y + h * 0.68, w * 0.46, h * 0.3, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillRect(x, y + h * 0.48, 5, h * 0.4);
                    ctx.fillRect(x + w * 0.42, y + h * 0.18, w * 0.18, h * 0.25);
                    ctx.fillRect(x + w * 0.48, y + 2, 3, h * 0.2);
                    ctx.fillRect(x + w * 0.42, y + 2, 9, 3);
                    break;

                case "mina_marina":
                    const cx = x + w * 0.5, cy = y + h * 0.5, r = w * 0.32;
                    ctx.beginPath();
                    ctx.arc(cx, cy, r, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.lineWidth = 3.5;
                    ctx.beginPath();
                    for (let a = 0; a < Math.PI * 2; a += Math.PI / 4) {
                        ctx.moveTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r);
                        ctx.lineTo(cx + Math.cos(a) * (r + 7), cy + Math.sin(a) * (r + 7));
                    }
                    ctx.stroke();
                    break;

                case "Dragón Mitológico":
                case "Fénix Ancestral":
                case "grifo":
                    ctx.beginPath();
                    ctx.ellipse(x + w * 0.46, y + h * 0.62, w * 0.28, h * 0.2, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.moveTo(x + w * 0.64, y + h * 0.55);
                    ctx.lineTo(x + w * 0.82, y + h * 0.18);
                    ctx.lineTo(x + w, y + h * 0.24);
                    ctx.lineTo(x + w * 0.88, y + h * 0.34);
                    ctx.lineTo(x + w * 0.74, y + h * 0.68);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.moveTo(x + w * 0.22, y + h * 0.6);
                    ctx.quadraticCurveTo(x + w * 0.08, y + h * 0.4, x, y + h * 0.5 + step);
                    ctx.lineTo(x + w * 0.24, y + h * 0.72);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.moveTo(x + w * 0.48, y + h * 0.52);
                    ctx.lineTo(x + w * 0.32, y + step * 1.6);
                    ctx.lineTo(x + w * 0.52, y + h * 0.22 + step);
                    ctx.lineTo(x + w * 0.66, y + h * 0.48);
                    ctx.fill();
                    break;

                case "torre":
                    ctx.fillRect(x + 5, y + 12, w - 10, h - 12);
                    ctx.fillRect(x + 2, y, w * 0.24, 12);
                    ctx.fillRect(x + w * 0.38, y, w * 0.24, 12);
                    ctx.fillRect(x + w * 0.74, y, w * 0.24, 12);
                    ctx.fillStyle = COLOR_BG;
                    ctx.fillRect(x + w * 0.42, y + 28, w * 0.16, 18);
                    break;

                default:
                    ctx.fillRect(x, y, w, h);
            }
        }
                let currentStageIndex = 0;
        let distance = 0;
        let gameSpeed = 5;
        let isGameOver = false;
        let isBossBattle = false;
        let bossDownPresses = 0;

        class Player {
            constructor() {
                this.x = 60;
                this.y = canvas.height - 50;
                this.vy = 0;
                this.gravity = 0.6;
                this.jumpForce = -11;
                this.jumpCount = 0;
            }

            get currentSpecs() {
                return STAGES[currentStageIndex].playerSize;
            }

            canDoubleJump() {
                for (let obs of obstacles) {
                    if (obs.big && obs.x > this.x - 30 && obs.x < this.x + 280) {
                        return true;
                    }
                }
                return false;
            }

            jump() {
                if (isBossBattle || boss) return;

                if (this.jumpCount === 0) {
                    this.vy = this.jumpForce;
                    this.jumpCount = 1;
                } else if (this.jumpCount === 1 && this.canDoubleJump()) {
                    this.vy = this.jumpForce;
                    this.jumpCount = 2;
                }
            }

            update() {
                let groundLevel = canvas.height - this.currentSpecs.h;
                if (STAGES[currentStageIndex].environment === "sea") {
                    groundLevel -= 20;
                }

                this.y += this.vy;
                if (this.y < groundLevel) {
                    this.vy += this.gravity;
                } else {
                    this.y = groundLevel;
                    this.vy = 0;
                    this.jumpCount = 0;
                }
            }

            draw() {
                const stageName = STAGES[currentStageIndex].name;
                drawSilhouette(stageName, this.x, this.y, this.currentSpecs.w, this.currentSpecs.h);
            }
        }

        class Entity {
            constructor(isBoss = false) {
                this.isBoss = isBoss;
                const stage = STAGES[currentStageIndex];
                
                if (isBoss) {
                    this.w = stage.boss.w;
                    this.h = stage.boss.h;
                    this.type = stage.boss.type;
                    this.big = true;
                } else {
                    const obsList = stage.obstacles;
                    const template = obsList[Math.floor(Math.random() * obsList.length)];
                    this.w = template.w;
                    this.h = template.h;
                    this.type = template.type;
                    this.big = template.big;
                }

                this.x = canvas.width;
                this.y = canvas.height - this.h;
                if (stage.environment === "sea") this.y -= 20;
            }

            update() {
                if (!isBossBattle) {
                    this.x -= this.isBoss ? gameSpeed * 1.4 : gameSpeed;
                }
            }

            draw() {
                drawSilhouette(this.type, this.x, this.y, this.w, this.h);
            }
        }

        const player = new Player();
        let obstacles = [];
        let boss = null;
        let spawnTimer = 0;

        window.addEventListener('keydown', (e) => {
            if (e.code === 'KeyR') {
                resetGame();
                return;
            }

            if (isGameOver && e.code === 'Space') {
                resetGame();
                return;
            }

            if (e.code === 'Space' || e.code === 'ArrowUp') {
                e.preventDefault();
                player.jump();
            }

            if (e.code === 'ArrowDown' && isBossBattle) {
                e.preventDefault();
                bossDownPresses++;
                document.getElementById('battle-progress').style.width = (bossDownPresses * 50) + "%";
                
                if (bossDownPresses >= 2) {
                    winBossBattle();
                }
            }
        });

        function startBossBattle() {
            isBossBattle = true;
            bossDownPresses = 0;
            document.getElementById('battle-ui').classList.remove('hidden');
            document.getElementById('battle-progress').style.width = "0%";
        }

        function winBossBattle() {
            isBossBattle = false;
            boss = null;
            obstacles = [];
            player.x = 60;
            document.getElementById('battle-ui').classList.add('hidden');
            
            if (currentStageIndex < STAGES.length - 1) {
                currentStageIndex++;
            } else {
                gameSpeed += 1;
            }
            document.getElementById('stage-display').innerText = "Etapa: " + STAGES[currentStageIndex].name;
        }

        function checkCollision(rect1, rect2) {
            const pad = 4;
            return (
                rect1.x + pad < rect2.x + rect2.w - pad &&
                rect1.x + rect1.currentSpecs.w - pad > rect2.x + pad &&
                rect1.y + pad < rect2.y + rect2.h - pad &&
                rect1.y + rect1.currentSpecs.h - pad > rect2.y + pad
            );
        }

        function drawEnvironment() {
            const env = STAGES[currentStageIndex].environment;
            if (env === "sea") {
                ctx.fillStyle = COLOR_WATER;
                ctx.fillRect(0, canvas.height - 25, canvas.width, 25);
            }
        }

        function resetGame() {
            const wasGameOver = isGameOver;
            currentStageIndex = 0;
            distance = 0;
            gameSpeed = 5;
            obstacles = [];
            boss = null;
            isBossBattle = false;
            isGameOver = false;
            player.x = 60;
            player.vy = 0;
            document.getElementById('stage-display').innerText = "Etapa: " + STAGES[0].name;
            document.getElementById('distance-display').innerText = "Distancia: 0m";
            document.getElementById('battle-ui').classList.add('hidden');
            if (wasGameOver) {
                animate();
            }
        }

        function animate() {
            updateColorsFromCSS();
            frameCount++;

            if (isGameOver) {
                ctx.fillStyle = COLOR_SILHOUETTE;
                ctx.font = "20px Courier New";
                ctx.fillText("GAME OVER - Presiona Espacio o R para reiniciar", 110, 150);
                return;
            }

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawEnvironment();

            if (!isBossBattle) {
                distance += 0.15;
                document.getElementById('distance-display').innerText = `Distancia: ${Math.floor(distance)}m`;
            }

            // AQUÍ SE DEFINE LA DISTANCIA DE LOS JEFES (200m)
            let targetDistance = (currentStageIndex + 1) * 200;
            if (distance >= targetDistance && !boss) {
                obstacles = []; 
                boss = new Entity(true);
            }

            // Deja de generar obstáculos 35 metros antes de que salga el jefe
            if (!boss && !isBossBattle && distance < targetDistance - 35) {
                spawnTimer++;
                if (spawnTimer > 90 + Math.random() * 60) {
                    obstacles.push(new Entity(false));
                    spawnTimer = 0;
                }
            }

            player.update();
            player.draw();

            // Solo procesa obstáculos si el jefe aún no ha salido
            if (!boss) {
                for (let i = obstacles.length - 1; i >= 0; i--) {
                    let obs = obstacles[i];
                    obs.update();
                    obs.draw();

                    if (checkCollision(player, obs)) {
                        isGameOver = true;
                    }

                    if (obs.x + obs.w < 0) {
                        obstacles.splice(i, 1);
                    }
                }
            }

            if (boss) {
                if (!isBossBattle) {
                    player.x += 2.5;
                    player.y += (boss.y + boss.h - player.currentSpecs.h - player.y) * 0.15;
                }

                boss.update();
                boss.draw();

                if (checkCollision(player, boss) && !isBossBattle) {
                    startBossBattle();
                }
            }

            requestAnimationFrame(animate);
        }

        window.onload = animate;
    </script>
</body>
</html>
