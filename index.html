<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Evolución Runner</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <div class="hud">
            <span id="stage-display">Etapa: Humano</span>
            <span id="record-display">Récord: 0m</span>
            <span id="distance-display">Distancia: 0m</span>
        </div>
        
        <canvas id="gameCanvas" width="800" height="300"></canvas>
        
        <div id="battle-ui" class="hidden">
            <p id="battle-text">¡OBJETIVO DETECTADO! Presiona [↓] o TOCA LA PANTALLA 2 veces</p>
            <div class="progress-bar"><div id="battle-progress"></div></div>
        </div>

        <div class="controls-info">
            <p><strong>PC:</strong> [Espacio/↑] Saltar | [↓ x2] Atacar | [R] Reiniciar &nbsp;|&nbsp; <strong>Móvil:</strong> Toca para saltar (2 toques al chocar jefe)</p>
        </div>
    </div>

    <script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let COLOR_SILHOUETTE = '#111111';
let COLOR_WATER = '#000000';
let COLOR_BG = '#d3d3d3';
let frameCount = 0;

function updateColorsFromCSS() {
    const styles = getComputedStyle(document.documentElement);
    const sil = styles.getPropertyValue('--silhouette-color').trim();
    const wat = styles.getPropertyValue('--water-color').trim();
    const bg = styles.getPropertyValue('--bg-color').trim();
    if (sil) COLOR_SILHOUETTE = sil;
    if (wat) COLOR_WATER = wat;
    if (bg) COLOR_BG = bg;
}

function drawSilhouette(type, x, y, w, h, faceRight = true) {
    ctx.save();
    const mirrorable = ["Humano", "Sirena", "Barco Gigante", "Dragón Mitológico", "Fénix Ancestral", "Minotauro", "Cancerbero"];
    if (mirrorable.includes(type) && !faceRight) {
        ctx.translate(x + w, y);
        ctx.scale(-1, 1);
        drawRawSilhouette(type, 0, 0, w, h);
    } else {
        drawRawSilhouette(type, x, y, w, h);
    }
    ctx.restore();
}

function drawRawSilhouette(type, x, y, w, h) {
    ctx.fillStyle = COLOR_SILHOUETTE;
    ctx.strokeStyle = COLOR_SILHOUETTE;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    const step = Math.sin(frameCount * 0.25) * 6;

    switch (type) {
        case "Humano":
            ctx.beginPath();
            ctx.arc(x + w * 0.5, y + 7, 5.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.moveTo(x + w * 0.36, y + 14);
            ctx.lineTo(x + w * 0.64, y + 14);
            ctx.lineTo(x + w * 0.6, y + 33);
            ctx.lineTo(x + w * 0.4, y + 33);
            ctx.closePath();
            ctx.fill();
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(x + w * 0.36, y + 16);
            ctx.lineTo(x + w * 0.28, y + 31);
            ctx.moveTo(x + w * 0.64, y + 16);
            ctx.lineTo(x + w * 0.72, y + 31);
            ctx.stroke();
            ctx.lineWidth = 3.5;
            ctx.beginPath();
            ctx.moveTo(x + w * 0.44, y + 32);
            ctx.lineTo(x + w * 0.42, y + h);
            ctx.moveTo(x + w * 0.56, y + 32);
            ctx.lineTo(x + w * 0.58, y + h);
            ctx.stroke();
            break;

        case "arquero":
            ctx.beginPath();
            ctx.arc(x + w * 0.62, y + 9, 6, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillRect(x + w * 0.54, y + 16, 10, 17);
            ctx.lineWidth = 3.5;
            ctx.beginPath();
            ctx.moveTo(x + w * 0.56, y + 33);
            ctx.lineTo(x + w * 0.46, y + h);
            ctx.moveTo(x + w * 0.62, y + 33);
            ctx.lineTo(x + w * 0.72, y + h);
            ctx.stroke();
            ctx.lineWidth = 2.8;
            ctx.beginPath();
            ctx.moveTo(x + w * 0.56, y + 19);
            ctx.lineTo(x + w * 0.24, y + 14);
            ctx.stroke();
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            ctx.arc(x + w * 0.36, y + 16, 15, Math.PI * 0.7, Math.PI * 1.45);
            ctx.stroke();
            ctx.lineWidth = 1.8;
            ctx.beginPath();
            ctx.moveTo(x + w * 0.54, y + 21);
            ctx.lineTo(x + 4, y + 6);
            ctx.stroke();
            break;

        case "caballero":
            ctx.beginPath();
            ctx.arc(x + w * 0.54, y + 12, 7, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.moveTo(x + w * 0.54, y + 5);
            ctx.quadraticCurveTo(x + w * 0.75, y, x + w * 0.85, y + 10);
            ctx.lineTo(x + w * 0.62, y + 10);
            ctx.fill();
            ctx.beginPath();
            ctx.moveTo(x + w * 0.38, y + 19);
            ctx.lineTo(x + w * 0.68, y + 19);
            ctx.lineTo(x + w * 0.64, y + 36);
            ctx.lineTo(x + w * 0.36, y + 36);
            ctx.fill();
            ctx.beginPath();
            ctx.ellipse(x + w * 0.58, y + 28, 6, 10, 0.1, 0, Math.PI * 2);
            ctx.fill();
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(x + w * 0.42, y + 24);
            ctx.lineTo(x + 2, y + 14);
            ctx.stroke();
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            ctx.moveTo(x + 12, y + 12);
            ctx.lineTo(x + 16, y + 21);
            ctx.stroke();
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(x + w * 0.44, y + 35);
            ctx.lineTo(x + w * 0.36, y + h);
            ctx.moveTo(x + w * 0.6, y + 35);
            ctx.lineTo(x + w * 0.68, y + h);
            ctx.stroke();
            break;
        case "asaltante":
            ctx.beginPath();
            ctx.arc(x + w * 0.46, y + 10, 6.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillRect(x + w * 0.24, y + 6, 10, 3);
            ctx.beginPath();
            ctx.moveTo(x + w * 0.32, y + 17);
            ctx.lineTo(x + w * 0.68, y + 19);
            ctx.lineTo(x + w * 0.64, y + 35);
            ctx.lineTo(x + w * 0.3, y + 35);
            ctx.fill();
            ctx.lineWidth = 3.5;
            ctx.beginPath();
            ctx.moveTo(x + w * 0.35, y + 20);
            ctx.lineTo(x + 10, y + 22);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(x + 10, y + 20);
            ctx.lineTo(x, y + 22);
            ctx.lineTo(x + 10, y + 24);
            ctx.fill();
            ctx.beginPath();
            ctx.moveTo(x + w * 0.36, y + 34);
            ctx.lineTo(x + w * 0.24, y + h - 6);
            ctx.lineTo(x + w * 0.18, y + h);
            ctx.moveTo(x + w * 0.58, y + 34);
            ctx.lineTo(x + w * 0.68, y + h - 6);
            ctx.lineTo(x + w * 0.62, y + h);
            ctx.stroke();
            break;

        case "bici":
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            ctx.arc(x + 9, y + h - 9, 8, 0, Math.PI * 2);
            ctx.moveTo(x + w - 9 + 8, y + h - 9);
            ctx.arc(x + w - 9, y + h - 9, 8, 0, Math.PI * 2);
            ctx.moveTo(x + 9, y + h - 17);
            ctx.lineTo(x + 9, y + h - 1);
            ctx.moveTo(x + w - 9, y + h - 17);
            ctx.lineTo(x + w - 9, y + h - 1);
            ctx.moveTo(x + 9, y + h - 9);
            ctx.lineTo(x + w * 0.44, y + 11);
            ctx.lineTo(x + w * 0.72, y + 11);
            ctx.lineTo(x + w * 0.48, y + h - 9);
            ctx.closePath();
            ctx.moveTo(x + w * 0.44, y + 11);
            ctx.lineTo(x + w * 0.34, y + 5);
            ctx.moveTo(x + w * 0.72, y + 11);
            ctx.lineTo(x + w - 9, y + h - 9);
            ctx.moveTo(x + w * 0.72, y + 11);
            ctx.lineTo(x + w * 0.66, y + 4);
            ctx.stroke();
            ctx.fillRect(x + w * 0.24, y + 3, 9, 3);
            break;

        case "auto":
            ctx.beginPath();
            ctx.moveTo(x + 2, y + h - 8);
            ctx.lineTo(x + 2, y + h * 0.44);
            ctx.lineTo(x + w * 0.2, y + h * 0.38);
            ctx.lineTo(x + w * 0.36, y + 4);
            ctx.lineTo(x + w * 0.76, y + 4);
            ctx.lineTo(x + w * 0.9, y + h * 0.4);
            ctx.lineTo(x + w, y + h * 0.45);
            ctx.lineTo(x + w, y + h - 8);
            ctx.fill();
            ctx.fillRect(x + w - 6, y + h * 0.28, 6, 4);
            ctx.fillRect(x + w - 4, y + h * 0.32, 3, 6);
            ctx.fillStyle = COLOR_BG;
            ctx.beginPath();
            ctx.moveTo(x + w * 0.25, y + h * 0.38);
            ctx.lineTo(x + w * 0.38, y + 8);
            ctx.lineTo(x + w * 0.54, y + 8);
            ctx.lineTo(x + w * 0.54, y + h * 0.38);
            ctx.fill();
            ctx.beginPath();
            ctx.moveTo(x + w * 0.58, y + h * 0.38);
            ctx.lineTo(x + w * 0.58, y + 8);
            ctx.lineTo(x + w * 0.74, y + 8);
            ctx.lineTo(x + w * 0.85, y + h * 0.38);
            ctx.fill();
            ctx.fillStyle = COLOR_SILHOUETTE;
            ctx.beginPath();
            ctx.arc(x + w * 0.22, y + h - 7, 8, 0, Math.PI * 2);
            ctx.arc(x + w * 0.78, y + h - 7, 8, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = COLOR_BG;
            ctx.beginPath();
            ctx.arc(x + w * 0.22, y + h - 7, 3, 0, Math.PI * 2);
            ctx.arc(x + w * 0.78, y + h - 7, 3, 0, Math.PI * 2);
            ctx.fill();
            break;

        case "Sirena":
            ctx.beginPath();
            ctx.arc(x + w * 0.76, y + h * 0.22, 6, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.moveTo(x + w * 0.78, y + h * 0.14);
            ctx.bezierCurveTo(x + w * 0.65, y, x + w * 0.45, y + h * 0.05, x + w * 0.32, y + h * 0.2);
            ctx.quadraticCurveTo(x + w * 0.42, y + h * 0.22, x + w * 0.28, y + h * 0.32 - step * 0.3);
            ctx.quadraticCurveTo(x + w * 0.52, y + h * 0.38, x + w * 0.72, y + h * 0.32);
            ctx.fill();
            ctx.lineWidth = 2.8;
            ctx.beginPath();
            ctx.moveTo(x + w * 0.72, y + h * 0.34);
            ctx.quadraticCurveTo(x + w * 0.6, y + h * 0.44, x + w * 0.48, y + h * 0.46);
            ctx.moveTo(x + w * 0.8, y + h * 0.34);
            ctx.quadraticCurveTo(x + w * 0.9, y + h * 0.42, x + w * 0.98, y + h * 0.36 + step * 0.2);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(x + w * 0.77, y + h * 0.28);
            ctx.quadraticCurveTo(x + w * 0.68, y + h * 0.44, x + w * 0.62, y + h * 0.52);
            ctx.bezierCurveTo(x + w * 0.72, y + h * 0.72, x + w * 0.55, y + h * 0.92, x + w * 0.32, y + h * 0.82 + step * 0.3);
            ctx.quadraticCurveTo(x + w * 0.15, y + h * 0.65 + step * 0.3, x, y + h * 0.76 + step * 0.3);
            ctx.quadraticCurveTo(x + w * 0.14, y + h * 0.86 + step * 0.3, x + w * 0.16, y + h + step * 0.3);
            ctx.quadraticCurveTo(x + w * 0.26, y + h * 0.9 + step * 0.3, x + w * 0.34, y + h * 0.86 + step * 0.3);
            ctx.bezierCurveTo(x + w * 0.48, y + h * 0.82, x + w * 0.56, y + h * 0.66, x + w * 0.56, y + h * 0.5);
            ctx.quadraticCurveTo(x + w * 0.64, y + h * 0.4, x + w * 0.73, y + h * 0.28);
            ctx.fill();
            break;

        case "contaminacion":
            ctx.fillRect(x + 6, y + 8, w - 12, h - 8);
            ctx.fillRect(x + 4, y + 11, w - 8, 2.5);
            ctx.fillRect(x + 4, y + 20, w - 8, 2.5);
            ctx.beginPath();
            ctx.arc(x + w * 0.35, y + 5, 4.5, 0, Math.PI * 2);
            ctx.arc(x + w * 0.65, y + 4, 5.5, 0, Math.PI * 2);
            ctx.arc(x + w * 0.5, y + 7, 4, 0, Math.PI * 2);
            ctx.fill();
            break;

        case "red":
            ctx.fillRect(x, y, w, 4);
            ctx.beginPath();
            ctx.arc(x + 4, y + 2, 4, 0, Math.PI * 2);
            ctx.arc(x + w - 4, y + 2, 4, 0, Math.PI * 2);
            ctx.fill();
            ctx.lineWidth = 2;
            ctx.beginPath();
            for (let i = 4; i <= w - 4; i += 7) {
                ctx.moveTo(x + i, y + 4);
                ctx.lineTo(x + i + Math.sin(i) * 3, y + h * 0.9);
            }
            for (let j = 10; j <= h * 0.88; j += 7) {
                ctx.moveTo(x + 2, y + j);
                ctx.lineTo(x + w - 2, y + j);
            }
            ctx.stroke();
            break;
        case "barco_pequeno":
        case "barco_enemigo":
            ctx.beginPath();
            ctx.moveTo(x + w * 0.16, y + h * 0.64);
            ctx.lineTo(x, y + h * 0.5);
            ctx.lineTo(x + w * 0.22, y + h * 0.68);
            ctx.quadraticCurveTo(x + w * 0.55, y + h * 0.72, x + w * 0.95, y + h * 0.56);
            ctx.lineTo(x + w * 0.86, y + h);
            ctx.lineTo(x + w * 0.26, y + h);
            ctx.quadraticCurveTo(x + w * 0.18, y + h * 0.82, x + w * 0.16, y + h * 0.64);
            ctx.fill();
            [0.34, 0.56, 0.78].forEach((m, idx) => {
                let topY = y + h * [0.22, 0.08, 0.24][idx];
                ctx.fillRect(x + w * m, topY, 2.5, h * (0.68 - [0.22, 0.08, 0.24][idx]));
                ctx.beginPath();
                ctx.moveTo(x + w * (m - 0.1), topY + h * 0.16);
                ctx.quadraticCurveTo(x + w * m, topY + h * 0.12, x + w * (m + 0.12), topY + h * 0.16);
                ctx.quadraticCurveTo(x + w * (m + 0.06), topY + h * 0.34, x + w * (m + 0.12), topY + h * 0.44);
                ctx.lineTo(x + w * (m - 0.1), topY + h * 0.44);
                ctx.fill();
            });
            break;

        case "Barco Gigante":
            ctx.beginPath();
            ctx.moveTo(x + w * 0.84, y + h * 0.64);
            ctx.lineTo(x + w, y + h * 0.5);
            ctx.lineTo(x + w * 0.78, y + h * 0.68);
            ctx.quadraticCurveTo(x + w * 0.45, y + h * 0.72, x + w * 0.05, y + h * 0.56);
            ctx.lineTo(x + w * 0.14, y + h);
            ctx.lineTo(x + w * 0.74, y + h);
            ctx.quadraticCurveTo(x + w * 0.82, y + h * 0.82, x + w * 0.84, y + h * 0.64);
            ctx.fill();
            [0.66, 0.44, 0.22].forEach((m, idx) => {
                let topY = y + h * [0.22, 0.08, 0.24][idx];
                ctx.fillRect(x + w * m, topY, 2.5, h * (0.68 - [0.22, 0.08, 0.24][idx]));
                ctx.beginPath();
                ctx.moveTo(x + w * (m + 0.1), topY + h * 0.16);
                ctx.quadraticCurveTo(x + w * m, topY + h * 0.12, x + w * (m - 0.12), topY + h * 0.16);
                ctx.quadraticCurveTo(x + w * (m - 0.06), topY + h * 0.34, x + w * (m - 0.12), topY + h * 0.44);
                ctx.lineTo(x + w * (m + 0.1), topY + h * 0.44);
                ctx.fill();
            });
            break;

        case "pulpo_mini":
            ctx.beginPath();
            ctx.arc(x + w * 0.48, y + h * 0.32, w * 0.24, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = COLOR_BG;
            ctx.beginPath();
            ctx.arc(x + w * 0.43, y + h * 0.36, 2, 0, Math.PI * 2);
            ctx.arc(x + w * 0.53, y + h * 0.36, 2, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = COLOR_SILHOUETTE;
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(x + w * 0.35, y + h * 0.48);
            ctx.quadraticCurveTo(x + w * 0.1, y + h * 0.45, x + w * 0.12, y + h * 0.65);
            ctx.moveTo(x + w * 0.38, y + h * 0.52);
            ctx.quadraticCurveTo(x + w * 0.05, y + h * 0.85, x + w * 0.22, y + h * 0.95);
            ctx.moveTo(x + w * 0.46, y + h * 0.54);
            ctx.quadraticCurveTo(x + w * 0.35, y + h * 0.98, x + w * 0.5, y + h * 0.92);
            ctx.moveTo(x + w * 0.56, y + h * 0.54);
            ctx.quadraticCurveTo(x + w * 0.68, y + h * 0.98, x + w * 0.78, y + h * 0.88);
            ctx.moveTo(x + w * 0.62, y + h * 0.48);
            ctx.quadraticCurveTo(x + w * 0.92, y + h * 0.6, x + w * 0.88, y + h * 0.35);
            ctx.stroke();
            break;

        case "Kraken":
            ctx.beginPath();
            ctx.moveTo(x + w * 0.5, y);
            ctx.quadraticCurveTo(x + w * 0.62, y + h * 0.1, x + w * 0.72, y + h * 0.18);
            ctx.lineTo(x + w * 0.61, y + h * 0.21);
            ctx.quadraticCurveTo(x + w * 0.64, y + h * 0.34, x + w * 0.62, y + h * 0.45);
            ctx.lineTo(x + w * 0.38, y + h * 0.45);
            ctx.quadraticCurveTo(x + w * 0.36, y + h * 0.34, x + w * 0.39, y + h * 0.21);
            ctx.lineTo(x + w * 0.28, y + h * 0.18);
            ctx.quadraticCurveTo(x + w * 0.38, y + h * 0.1, x + w * 0.5, y);
            ctx.fill();
            ctx.fillStyle = COLOR_BG;
            ctx.beginPath();
            ctx.ellipse(x + w * 0.41, y + h * 0.38, 3.2, 4.5, -0.2, 0, Math.PI * 2);
            ctx.ellipse(x + w * 0.59, y + h * 0.38, 3.2, 4.5, 0.2, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = COLOR_SILHOUETTE;
            const krakenArms = [
                { sx: 0.4, sy: 0.42, c1x: 0.18, c1y: 0.42, c2x: 0.14, c2y: 0.28, ex: 0.18, ey: 0.16, lw: 4.5 },
                { sx: 0.39, sy: 0.44, c1x: 0.12, c1y: 0.48, c2x: 0.02, c2y: 0.68, ex: 0.06, ey: 0.88, lw: 5 },
                { sx: 0.43, sy: 0.45, c1x: 0.16, c1y: 0.65, c2x: 0.12, c2y: 0.92, ex: 0.24, ey: 0.98, lw: 4.5 },
                { sx: 0.47, sy: 0.45, c1x: 0.34, c1y: 0.76, c2x: 0.32, c2y: 0.98, ex: 0.48, ey: 0.88, lw: 4 },
                { sx: 0.53, sy: 0.45, c1x: 0.56, c1y: 0.78, c2x: 0.72, c2y: 0.95, ex: 0.64, ey: 0.76, lw: 4 },
                { sx: 0.57, sy: 0.45, c1x: 0.78, c1y: 0.65, c2x: 0.86, c2y: 0.88, ex: 0.78, ey: 0.98, lw: 4.5 },
                { sx: 0.61, sy: 0.44, c1x: 0.88, c1y: 0.46, c2x: 0.98, c2y: 0.64, ex: 0.92, ey: 0.86, lw: 5 },
                { sx: 0.6, sy: 0.42, c1x: 0.85, c1y: 0.4, c2x: 0.92, c2y: 0.22, ex: 0.8, ey: 0.15, lw: 4.5 }
            ];
            krakenArms.forEach((arm, idx) => {
                let wv = Math.sin(frameCount * 0.16 + idx * 0.9) * 3.5;
                ctx.lineWidth = arm.lw;
                ctx.beginPath();
                ctx.moveTo(x + w * arm.sx, y + h * arm.sy);
                ctx.bezierCurveTo(x + w * arm.c1x + wv, y + h * arm.c1y, x + w * arm.c2x - wv, y + h * arm.c2y, x + w * arm.ex + wv, y + h * arm.ey);
                ctx.stroke();
            });
            break;

        case "submarino":
            ctx.beginPath();
            ctx.ellipse(x + w * 0.5, y + h * 0.68, w * 0.46, h * 0.3, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillRect(x, y + h * 0.46, 5, h * 0.44);
            ctx.fillRect(x + w * 0.42, y + h * 0.18, w * 0.18, h * 0.25);
            ctx.fillRect(x + w * 0.48, y + 2, 3, h * 0.2);
            ctx.fillRect(x + w * 0.42, y + 2, 10, 3);
            ctx.fillStyle = COLOR_BG;
            for (let s = 0.3; s <= 0.7; s += 0.2) {
                ctx.beginPath();
                ctx.arc(x + w * s, y + h * 0.68, 3, 0, Math.PI * 2);
                ctx.fill();
            }
            break;

        case "mina_marina":
            const cx = x + w * 0.5, cy = y + h * 0.5, r = w * 0.32;
            ctx.beginPath();
            ctx.arc(cx, cy, r, 0, Math.PI * 2);
            ctx.fill();
            ctx.lineWidth = 3.5;
            ctx.beginPath();
            for (let a = 0; a < Math.PI * 2; a += Math.PI / 4) {
                ctx.moveTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r);
                ctx.lineTo(cx + Math.cos(a) * (r + 7), cy + Math.sin(a) * (r + 7));
            }
            ctx.stroke();
            break;
        case "Dragón Mitológico":

        boss: { name: "Guardián del Abismo", type: "Cancerbero", w: 125, h: 88 }
    }
];
function drawBackgroundDetails(env) {
    ctx.save();
    ctx.fillStyle = "rgba(0, 0, 0, 0.14)";
    ctx.strokeStyle = "rgba(0, 0, 0, 0.14)";

    if (env === "city") {
        const buildings = [
            { w: 55, h: 110 }, { w: 45, h: 75 }, { w: 70, h: 140 },
            { w: 50, h: 90 }, { w: 65, h: 125 }, { w: 40, h: 65 },
            { w: 75, h: 130 }, { w: 50, h: 85 }
        ];
        const totalW = 450;
        const scroll = (frameCount * 0.8) % totalW;
        for (let rep = 0; rep < 3; rep++) {
            let bx = rep * totalW - scroll;
            buildings.forEach((b) => {
                ctx.fillRect(bx, canvas.height - b.h, b.w - 4, b.h);
                ctx.fillStyle = COLOR_BG;
                for (let wy = canvas.height - b.h + 12; wy < canvas.height - 20; wy += 16) {
                    for (let wx = bx + 8; wx < bx + b.w - 14; wx += 12) {
                        ctx.fillRect(wx, wy, 5, 8);
                    }
                }
                ctx.fillStyle = "rgba(0, 0, 0, 0.14)";
                bx += b.w;
            });
        }
    } else if (env === "sea") {
        for (let f = 0; f < 5; f++) {
            let fx = ((850 - (frameCount * (1.2 + f * 0.2) + f * 180) % 900));
            let fy = 70 + (f * 38) % 160;
            ctx.beginPath();
            ctx.ellipse(fx, fy, 11, 6, 0, 0, Math.PI * 2);
            ctx.moveTo(fx + 9, fy);
            ctx.lineTo(fx + 18, fy - 6);
            ctx.lineTo(fx + 15, fy);
            ctx.lineTo(fx + 18, fy + 6);
            ctx.fill();
        }

        if (STAGES[currentStageIndex].name === "Sirena") {
            if (!tritonSpawned && distance >= 285) {
                tritonSpawned = true;
                tritonTimer = 180;
            }
            if (tritonTimer > 0) {
                tritonTimer--;
                let progress = 1 - (tritonTimer / 180);
                let tx = 820 - progress * 880;
                let jumpArc = Math.sin(progress * Math.PI) * 58;
                let ty = (canvas.height - 14) - jumpArc;

                ctx.save();
                ctx.fillStyle = COLOR_WATER;
                ctx.strokeStyle = COLOR_WATER;
                ctx.beginPath();
                ctx.arc(tx, ty - 28, 6.5, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.moveTo(tx - 6, ty - 33);
                ctx.lineTo(tx - 3, ty - 40);
                ctx.lineTo(tx, ty - 34);
                ctx.lineTo(tx + 3, ty - 40);
                ctx.lineTo(tx + 6, ty - 33);
                ctx.fill();
                ctx.beginPath();
                ctx.moveTo(tx - 8, ty - 20);
                ctx.lineTo(tx + 8, ty - 20);
                ctx.lineTo(tx + 5, ty - 2);
                ctx.quadraticCurveTo(tx - 4, ty + 14, tx - 18, ty + 18);
                ctx.lineTo(tx - 26, ty + 10);
                ctx.lineTo(tx - 22, ty + 18);
                ctx.lineTo(tx - 28, ty + 24);
                ctx.lineTo(tx - 16, ty + 20);
                ctx.quadraticCurveTo(tx, ty + 14, tx - 5, ty - 2);
                ctx.fill();
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(tx + 7, ty - 18);
                ctx.lineTo(tx + 18, ty - 26);
                ctx.stroke();
                ctx.lineWidth = 2.5;
                ctx.beginPath();
                ctx.moveTo(tx + 18, ty + 4);
                ctx.lineTo(tx + 18, ty - 46);
                ctx.moveTo(tx + 12, ty - 38);
                ctx.lineTo(tx + 24, ty - 38);
                ctx.moveTo(tx + 12, ty - 38);
                ctx.lineTo(tx + 12, ty - 48);
                ctx.moveTo(tx + 24, ty - 38);
                ctx.lineTo(tx + 24, ty - 48);
                ctx.stroke();
                ctx.restore();
            }
        }
    } else if (env === "ship_sea") {
        ctx.lineWidth = 2;
        ctx.strokeStyle = "rgba(0, 0, 0, 0.28)";
        for (let g = 0; g < 4; g++) {
            let gx = 850 - ((frameCount * 1.4 + g * 210) % 920);
            let gy = 38 + (g % 3) * 24;
            let flap = Math.sin(frameCount * 0.18 + g) * 5;
            ctx.beginPath();
            ctx.moveTo(gx - 12, gy + flap);
            ctx.quadraticCurveTo(gx - 6, gy - 6, gx, gy);
            ctx.quadraticCurveTo(gx + 6, gy - 6, gx + 12, gy + flap);
            ctx.stroke();
        }

        ctx.fillStyle = COLOR_WATER;
        for (let d = 0; d < 2; d++) {
            let cycle = (frameCount * 0.035 + d * 3.14) % (Math.PI * 2);
            let dx = 820 - ((frameCount * 2.2 + d * 420) % 880);
            if (Math.sin(cycle) > -0.2) {
                let jumpHeight = Math.sin(cycle) * 48;
                let dy = (canvas.height - 16) - jumpHeight;
                let angle = -Math.cos(cycle) * 0.75;

                ctx.save();
                ctx.translate(dx, dy);
                ctx.rotate(angle);
                ctx.beginPath();
                ctx.moveTo(-22, 4);
                ctx.quadraticCurveTo(-5, -10, 14, -2);
                ctx.lineTo(22, 1);
                ctx.lineTo(14, 5);
                ctx.quadraticCurveTo(-4, 2, -22, 6);
                ctx.lineTo(-28, 12);
                ctx.lineTo(-24, 5);
                ctx.lineTo(-29, -2);
                ctx.fill();
                ctx.beginPath();
                ctx.moveTo(-2, -6);
                ctx.lineTo(-7, -14);
                ctx.lineTo(3, -5);
                ctx.fill();
                ctx.restore();
            }
        }
    }
    else if (env === "dragon_sky") {
        const scroll = (frameCount * 0.7) % 650;
        for (let rep = 0; rep < 3; rep++) {
            let mx = rep * 650 - scroll;
            ctx.beginPath();
            ctx.moveTo(mx, canvas.height);
            ctx.lineTo(mx + 90, canvas.height - 135);
            ctx.lineTo(mx + 180, canvas.height - 70);
            ctx.lineTo(mx + 270, canvas.height - 155);
            ctx.lineTo(mx + 390, canvas.height);
            ctx.fill();

            let cx = mx + 440;
            ctx.fillRect(cx, canvas.height - 85, 90, 85);
            ctx.fillRect(cx - 10, canvas.height - 115, 22, 115);
            ctx.fillRect(cx + 78, canvas.height - 115, 22, 115);
            ctx.beginPath();
            ctx.moveTo(cx - 14, canvas.height - 115);
            ctx.lineTo(cx + 1, canvas.height - 142);
            ctx.lineTo(cx + 16, canvas.height - 115);
            ctx.moveTo(cx + 74, canvas.height - 115);
            ctx.lineTo(cx + 89, canvas.height - 142);
            ctx.lineTo(cx + 104, canvas.height - 115);
            ctx.fill();
        }
    } else if (env === "volcano") {
        const scroll = (frameCount * 0.8) % 620;
        for (let rep = 0; rep < 3; rep++) {
            let vx = rep * 620 - scroll + 40;
            ctx.fillStyle = "rgba(0, 0, 0, 0.18)";
            ctx.beginPath();
            ctx.moveTo(vx, canvas.height);
            ctx.lineTo(vx + 95, canvas.height - 145);
            ctx.lineTo(vx + 135, canvas.height - 145);
            ctx.lineTo(vx + 230, canvas.height);
            ctx.fill();

            ctx.strokeStyle = "rgba(255, 85, 0, 0.45)";
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(vx + 105, canvas.height - 145);
            ctx.quadraticCurveTo(vx + 90, canvas.height - 95, vx + 65, canvas.height - 45);
            ctx.moveTo(vx + 125, canvas.height - 145);
            ctx.quadraticCurveTo(vx + 145, canvas.height - 85, vx + 165, canvas.height - 30);
            ctx.stroke();

            ctx.fillStyle = "rgba(0, 0, 0, 0.1)";
            let puff = (frameCount * 0.5) % 30;
            ctx.beginPath();
            ctx.arc(vx + 115, canvas.height - 160 - puff, 14, 0, Math.PI * 2);
            ctx.arc(vx + 128, canvas.height - 180 - puff, 18, 0, Math.PI * 2);
            ctx.fill();
        }
    } else if (env === "greece") {
        const scroll = (frameCount * 0.7) % 600;
        for (let rep = 0; rep < 3; rep++) {
            let gx = rep * 600 - scroll + 80;
            ctx.fillRect(gx, canvas.height - 14, 160, 14);
            for (let col = 0; col < 6; col++) {
                ctx.fillRect(gx + 12 + col * 25, canvas.height - 94, 10, 80);
            }
            ctx.beginPath();
            ctx.moveTo(gx - 6, canvas.height - 94);
            ctx.lineTo(gx + 80, canvas.height - 130);
            ctx.lineTo(gx + 166, canvas.height - 94);
            ctx.fill();
        }
    } else if (env === "underworld") {
        const scroll = (frameCount * 0.8) % 560;
        for (let rep = 0; rep < 3; rep++) {
            let ux = rep * 560 - scroll;
            for (let s = 0; s < 5; s++) {
                ctx.beginPath();
                ctx.moveTo(ux + s * 110, 0);
                ctx.lineTo(ux + s * 110 + 18, 45 + (s % 2) * 20);
                ctx.lineTo(ux + s * 110 + 36, 0);
                ctx.fill();
            }
            ctx.fillRect(ux + 180, canvas.height - 130, 18, 130);
            ctx.fillRect(ux + 280, canvas.height - 130, 18, 130);
            ctx.fillRect(ux + 168, canvas.height - 145, 142, 16);
        }
    }
    ctx.restore();
}

function drawEnvironment() {
    const env = STAGES[currentStageIndex].environment;
    drawBackgroundDetails(env);

    if (env === "sea" || env === "ship_sea") {
        ctx.fillStyle = COLOR_WATER;
        const waterTop = canvas.height - 22;
        ctx.fillRect(0, waterTop, canvas.width, 22);

        ctx.beginPath();
        ctx.moveTo(0, waterTop);
        for (let wx = 0; wx <= canvas.width; wx += 15) {
            const waveOffset = Math.sin((wx * 0.08) + (frameCount * 0.12)) * 3.5;
            ctx.lineTo(wx, waterTop + waveOffset);
        }
        ctx.lineTo(canvas.width, canvas.height);
        ctx.lineTo(0, canvas.height);
        ctx.closePath();
        ctx.fill();
    }
}

let fireworks = [];
let endingTimer = 0;

function spawnFirework(isMainText = false) {
    const fx = isMainText ? canvas.width * 0.5 : 100 + Math.random() * (canvas.width - 200);
    const fy = isMainText ? 72 : 45 + Math.random() * 80;
    const colors = ['#ff3b30', '#ff9500', '#ffcc00', '#34c759', '#007aff', '#af52de', '#111111'];
    const color = colors[Math.floor(Math.random() * colors.length)];
    let particles = [];
    const count = isMainText ? 48 : 26;
    for (let i = 0; i < count; i++) {
        const angle = (Math.PI * 2 * i) / count;
        const speed = isMainText ? (1.8 + Math.random() * 2.2) : (1.2 + Math.random() * 2);
        particles.push({
            x: fx,
            y: fy,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            alpha: 1,
            color: color
        });
    }
    fireworks.push({
        rocketX: fx,
        rocketY: canvas.height,
        targetY: fy,
        exploded: false,
        particles: particles,
        isMainText: isMainText
    });
}

function drawEndingCelebration() {
    endingTimer++;
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (endingTimer === 10) spawnFirework(true);
    if (endingTimer % 45 === 0) spawnFirework(false);

    for (let i = fireworks.length - 1; i >= 0; i--) {
        let fw = fireworks[i];
        if (!fw.exploded) {
            fw.rocketY -= 6;
            ctx.fillStyle = COLOR_SILHOUETTE;
            ctx.fillRect(fw.rocketX - 1.5, fw.rocketY, 3, 10);
            if (fw.rocketY <= fw.targetY) fw.exploded = true;
        } else {
            fw.particles.forEach(p => {
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.03;
                p.alpha -= fw.isMainText ? 0.006 : 0.014;
                if (p.alpha > 0) {
                    ctx.save();
                    ctx.globalAlpha = p.alpha;
                    ctx.fillStyle = p.color;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, 2.5, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }
            });

            if (fw.isMainText) {
                ctx.save();
                ctx.fillStyle = COLOR_SILHOUETTE;
                ctx.font = "bold 20px Courier New";
                ctx.textAlign = "center";
                ctx.fillText("FELICIDADES HAS LLEGADO AL FIN DEL CAMINO", canvas.width * 0.5, 76);
                ctx.font = "14px Courier New";
                ctx.fillText("Presiona [R] o toca la pantalla para volver a jugar", canvas.width * 0.5, 104);
                ctx.restore();
            }
        }
    }

    const cast = [
        { type: "Humano", w: 26, h: 50 },
        { type: "Sirena", w: 62, h: 44 },
        { type: "Barco Gigante", w: 76, h: 48 },
        { type: "Kraken", w: 76, h: 62 },
        { type: "Dragón Mitológico", w: 88, h: 56 },
        { type: "Fénix Ancestral", w: 84, h: 58 },
        { type: "Minotauro", w: 60, h: 64 },
        { type: "Cancerbero", w: 84, h: 58 }
    ];

    const spacing = canvas.width / (cast.length + 1);
    cast.forEach((char, idx) => {
        let cx = spacing * (idx + 1) - char.w * 0.5;
        let bounce = Math.abs(Math.sin(frameCount * 0.12 + idx * 0.7)) * 32;
        let cy = canvas.height - char.h - bounce;
        drawSilhouette(char.type, cx, cy, char.w, char.h, true);
    });
}
let currentStageIndex = 0;
let distance = 0;
let gameSpeed = 5;
let isGameOver = false;
let isBossBattle = false;
let isGameCompleted = false;
let bossDownPresses = 0;

function isWaterStage(env) {
    return env === "sea" || env === "ship_sea";
}

function updateHighScore() {
    const currentMeters = Math.floor(distance);
    if (currentMeters > highScore) {
        highScore = currentMeters;
        localStorage.setItem('evolucionRunnerRecord', highScore);
        document.getElementById('record-display').innerText = `Récord: ${highScore}m`;
    }
}

class Player {
    constructor() {
        this.x = 60;
        this.y = canvas.height - 50;
        this.vy = 0;
        this.gravity = 0.6;
        this.jumpForce = -11.5;
        this.jumpCount = 0;
    }

    get currentSpecs() {
        return STAGES[currentStageIndex].playerSize;
    }

    canDoubleJump() {
        for (let obs of obstacles) {
            if (obs.big && obs.x > this.x - 30 && obs.x < this.x + 280) {
                return true;
            }
        }
        return false;
    }

    jump() {
        if (isBossBattle || boss || isGameCompleted) return;

        if (this.jumpCount === 0) {
            this.vy = this.jumpForce;
            this.jumpCount = 1;
        } else if (this.jumpCount === 1 && this.canDoubleJump()) {
            this.vy = this.jumpForce;
            this.jumpCount = 2;
        }
    }

    update() {
        let groundLevel = canvas.height - this.currentSpecs.h;
        if (isWaterStage(STAGES[currentStageIndex].environment)) {
            groundLevel -= 20;
        }

        this.y += this.vy;
        if (this.y < groundLevel) {
            this.vy += this.gravity;
        } else {
            this.y = groundLevel;
            this.vy = 0;
            this.jumpCount = 0;
        }
    }

    draw() {
        const stageName = STAGES[currentStageIndex].name;
        drawSilhouette(stageName, this.x, this.y, this.currentSpecs.w, this.currentSpecs.h, true);
    }
}

class Entity {
    constructor(isBoss = false) {
        this.isBoss = isBoss;
        const stage = STAGES[currentStageIndex];
        
        if (isBoss) {
            this.w = stage.boss.w;
            this.h = stage.boss.h;
            this.type = stage.boss.type;
            this.big = true;
        } else {
            const obsList = stage.obstacles;
            const template = obsList[Math.floor(Math.random() * obsList.length)];
            this.w = template.w;
            this.h = template.h;
            this.type = template.type;
            this.big = template.big;
        }

        this.x = canvas.width;
        this.y = canvas.height - this.h;
        if (isWaterStage(stage.environment)) this.y -= 20;
    }

    update() {
        if (!isBossBattle) {
            this.x -= this.isBoss ? gameSpeed * 1.4 : gameSpeed;
        }
    }

    draw() {
        drawSilhouette(this.type, this.x, this.y, this.w, this.h, false);
    }
}

const player = new Player();
let obstacles = [];
let boss = null;
let spawnTimer = 0;

function registerBossHit() {
    if (!isBossBattle) return;
    bossDownPresses++;
    document.getElementById('battle-progress').style.width = (bossDownPresses * 50) + "%";
    if (bossDownPresses >= 2) {
        winBossBattle();
    }
}

window.addEventListener('keydown', (e) => {
    if (e.code === 'KeyR') {
        resetGame();
        return;
    }

    if (isGameCompleted && e.code === 'Space') {
        resetGame();
        return;
    }

    if (e.code === 'KeyM' && isGameOver) {
        continueFromDeath();
        return;
    }

    if (isGameOver && e.code === 'Space') {
        resetGame();
        return;
    }

    if (e.code === 'Space' || e.code === 'ArrowUp') {
        e.preventDefault();
        player.jump();
    }

    if (e.code === 'ArrowDown' && isBossBattle) {
        e.preventDefault();
        registerBossHit();
    }
});

window.addEventListener('touchstart', (e) => {
    e.preventDefault();

    if (isGameOver || isGameCompleted) {
        resetGame();
        return;
    }

    if (isBossBattle) {
        registerBossHit();
        return;
    }

    player.jump();
}, { passive: false });
function startBossBattle() {
    isBossBattle = true;
    bossDownPresses = 0;
    document.getElementById('battle-ui').classList.remove('hidden');
    document.getElementById('battle-progress').style.width = "0%";
}

function winBossBattle() {
    isBossBattle = false;
    boss = null;
    obstacles = [];
    player.x = 60;
    document.getElementById('battle-ui').classList.add('hidden');
    
    if (currentStageIndex < STAGES.length - 1) {
        currentStageIndex++;
        document.getElementById('stage-display').innerText = "Etapa: " + STAGES[currentStageIndex].name;
    } else {
        isGameCompleted = true;
        endingTimer = 0;
        fireworks = [];
        document.getElementById('stage-display').innerText = "¡FIN DEL CAMINO!";
    }
}

function checkCollision(rect1, rect2) {
    const pad = 6;
    return (
        rect1.x + pad < rect2.x + rect2.w - pad &&
        rect1.x + rect1.currentSpecs.w - pad > rect2.x + pad &&
        rect1.y + pad < rect2.y + rect2.h - pad &&
        rect1.y + rect1.currentSpecs.h - pad > rect2.y + pad
    );
}

function resetGame() {
    const wasStopped = isGameOver;
    currentStageIndex = 0;
    distance = 0;
    gameSpeed = 5;
    obstacles = [];
    boss = null;
    isBossBattle = false;
    isGameOver = false;
    isGameCompleted = false;
    tritonSpawned = false;
    tritonTimer = 0;
    fireworks = [];
    endingTimer = 0;
    player.x = 60;
    player.vy = 0;
    document.getElementById('stage-display').innerText = "Etapa: " + STAGES[0].name;
    document.getElementById('distance-display').innerText = "Distancia: 0m";
    document.getElementById('battle-ui').classList.add('hidden');
    if (wasStopped) {
        animate();
    }
}

function continueFromDeath() {
    obstacles = [];
    boss = null;
    isBossBattle = false;
    isGameOver = false;
    player.x = 60;
    player.vy = 0;
    player.jumpCount = 0;
    document.getElementById('battle-ui').classList.add('hidden');
    animate();
}

function animate() {
    updateColorsFromCSS();
    frameCount++;

    if (isGameCompleted) {
        drawEndingCelebration();
        requestAnimationFrame(animate);
        return;
    }

    if (isGameOver) {
        ctx.fillStyle = COLOR_SILHOUETTE;
        ctx.font = "18px Courier New";
        ctx.fillText("GAME OVER - [Espacio/R] Reiniciar | [M] Continuar aquí", 100, 150);
        return;
    }

    ctx.clearRect(0, 0, canvas.width, canvas.height);
    drawEnvironment();

    if (!isBossBattle) {
        distance += 0.15;
        document.getElementById('distance-display').innerText = `Distancia: ${Math.floor(distance)}m`;
        updateHighScore();
    }

    let targetDistance = (currentStageIndex + 1) * 100;
    if (distance >= targetDistance && !boss) {
        obstacles = []; 
        boss = new Entity(true);
    }

    if (!boss && !isBossBattle && distance < targetDistance - 35) {
        spawnTimer++;
        if (spawnTimer > 95 + Math.random() * 60) {
            obstacles.push(new Entity(false));
            spawnTimer = 0;
        }
    }

    player.update();
    player.draw();

    if (!boss) {
        for (let i = obstacles.length - 1; i >= 0; i--) {
            let obs = obstacles[i];
            obs.update();
            obs.draw();

            if (checkCollision(player, obs)) {
                isGameOver = true;
            }

            if (obs.x + obs.w < 0) {
                obstacles.splice(i, 1);
            }
        }
    }

    if (boss) {
        if (!isBossBattle) {
            player.x += 2.5;
            player.y += (boss.y + boss.h - player.currentSpecs.h - player.y) * 0.15;
        }

        boss.update();
        boss.draw();

        if (checkCollision(player, boss) && !isBossBattle) {
            startBossBattle();
        }
    }

    requestAnimationFrame(animate);
}

window.onload = animate;
